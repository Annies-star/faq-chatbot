<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI FAQ Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', 'Inter', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Mesh Gradient Background */
            background-color: #ffdee9;
            background-image: 
                radial-gradient(at 0% 0%, rgb(111, 103, 151) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, rgb(109, 237, 235) 0, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 420px;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        /* Decorative "Blob" in the corner */
        .container::before {
            content: "";
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            border-radius: 50%;
            z-index: 0;
            opacity: 0.5;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 30px;
            color: #2D3436;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .header p {
            color: #636E72;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        input {
            width: 100%;
            padding: 18px 25px;
            border: 2px solid #F1F2F6;
            border-radius: 20px;
            font-size: 16px;
            background: #F8F9FA;
            color: #2D3436;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #A29BFE;
            background: #fff;
            box-shadow: 0 10px 20px rgba(162, 155, 254, 0.1);
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 18px;
            border: none;
            border-radius: 20px;
            background: #6C5CE7;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
        }

        button:hover {
            background: #a29bfe;
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(108, 92, 231, 0.4);
        }

        .result-box {
            margin-top: 35px;
            background: #F1F2F6;
            padding: 25px;
            border-radius: 25px;
            position: relative;
        }

        .result-box::after {
            content: "✨";
            position: absolute;
            top: -15px;
            right: 20px;
            font-size: 24px;
        }

        .result-label {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            color: #B2BEC3;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            display: block;
        }

        .answer {
            color: #2D3436;
            font-size: 16px;
            line-height: 1.6;
            font-weight: 500;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: #B2BEC3;
            font-size: 12px;
            font-weight: 500;
        }
    </style>
    <!-- Modern Font Link -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="content">
        <div class="header">
            <h1>Ask Away.</h1>
            <p>I'm your AI companion, ready to answer your company and college questions.</p>
        </div>

        <form method="POST">
            <input type="text" name="question" placeholder="What's on your mind?" required>
            <button type="submit">Get Response</button>
        </form>

        <div class="result-box">
            <span class="result-label">AI Intelligence</span>
            <div class="answer">
                {{ answer if answer else "Your answer will appear here..." }}
            </div>
        </div>

        <div class="footer">
            Built with ❤️ using Flask & MySQL
        </div>
    </div>
</div>

</body>
</html>
